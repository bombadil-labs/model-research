    evidence: "12 stories · double-order transfer 0.600 (CI 0.519–0.681), but permutation p 0.104 and random-direction margin 0.100; the registered positive gate is not met"
    where: notes/goal_relative_result.md
    pre_registered: true
    superseded_by: null

  - id: fixed-plan-behavioral-capacity
