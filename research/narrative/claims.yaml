    evidence: "The reveal-order grid's recipient-clause bag scores 0.875; no goal switch with fixed fact wording has yet isolated goal-relative role"
    where: notes/reveal_invariance_result.md
    pre_registered: false
    superseded_by: null

  - id: fixed-plan-circumstance-transfer
    claim: The final-event fixed-plan interaction has a weak positive held-out score across both order changes in this controlled grid.
