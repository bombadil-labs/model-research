  - id: twohop-fact-flip-behavior
    claim: The instruction-tuned model changes its plan preference when a two-link route fact reverses the goal-reaching plan, across early and late tellings.
    status: holds
    evidence: "Gemma-2-9b-it: direct controls 32/32, identical repeats exact, two-link shifts 55/64 across both tellings (exact orientation p 0.0039; domain CI 0.719–0.969); 49/64 strict forced-choice reversals and 14/16 generated reversals on the fixed subset"
    where: notes/fact_flip_twohop_result.md
    pre_registered: true
    superseded_by: null

  - id: goal-route-cross-behavior
    claim: The instruction-tuned model's plan preference jointly tracks the requested destination and two-link route facts when either factor changes across early and late tellings.
    status: holds
    evidence: "Gemma-2-9b-it: direct sets 32/32, identical repeats exact, joint goal×route shifts 57/64 (exact orientation p 0.0039; domain CI 0.781–0.969); strict four-cell choices 49/64 and generated all-four correctness 13/16 on the fixed subset"
    where: notes/goal_route_cross_result.md
    pre_registered: true
    superseded_by: null

  - id: goal-route-choice-slot-transfer
    claim: A first-listed-plan-oriented goal × route interaction at the final prompt token has positive residual-direction transfer across held-out domains and early/late tellings on the frozen route miniatures.
    status: holds
    evidence: "Gemma-2-9b-it block-16/24 mean cosine +0.0854; exact orientation p 2/256; domain CI +0.0660 to +0.1094; positive in 8/8 domains in both telling directions. Block 16 alone is null and block 24 carries the signal; causal role remains untested."
    where: notes/goal_route_activation_pilot_result.md
    pre_registered: true
    superseded_by: null

  - id: generic-choice-slot-explanation
    claim: A generic two-person answer-slot direction is sufficient to explain the route-trained residual interaction's held-out transfer.
    status: open
    evidence: "Gemma-2-9b-it: route-trained block-24 direction transfers to direct route at +0.513 and unrelated property choice at +0.543, close to property's within-task +0.566 and far above random-direction q95 +0.020. The registered source-flip p is 25/256 for property and misses the gate, but this null is structurally weak for fixed-target transfer (93/256 assignments preserve a homogeneous source direction). Formal reading remains mixed/partial; a substantial generic component is supported, sufficiency remains open."
    where: notes/choice_slot_control_result.md
    pre_registered: true
    superseded_by: null

  - id: prequestion-route-interaction
    claim: The first-listed-plan-oriented goal × route interaction transfers across held-out domains and early/late tellings at the neutral bridge-end token before the answer question, under the fixed block-16/24 linear readout.
    status: falsified
    evidence: "Gemma-2-9b-it: bridge-end transfer −0.0036 (exact orientation p 186/256, domain CI −0.0082 to +0.0020; positive in 2/8 and 3/8 target tellings). The prebridge diagnostic is also null (−0.0005), while the same traces reproduce the prior positive final-question vectors exactly. This falsifies the specified token/readout transfer, not other positions or codes."
    where: notes/prequestion_route_state_result.md
    pre_registered: true
    superseded_by: null

  - id: generic-choice-slot-replication
