  - id: cached-npz-ledger
    claim: A measurement built from a cached .npz stack can reach the ledger.
    status: narrowed
    evidence: "h50 · narrowed — re-extraction lets fifteen rows through; the provenance wall was partly a property of how h48 ran"
    where: docs/EXPERIMENTS.md
