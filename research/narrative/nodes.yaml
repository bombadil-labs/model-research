  - id: nc1-slot-sufficiency
    title: Is a generic answer-slot direction sufficient to explain route transfer?
    kind: test
    claims: [generic-choice-slot-explanation]
    parent: null
    chain_from:
      experiments: ["#12 fact_flip_twohop", "#13 goal_route_cross", "#14 goal_route_activation_pilot",
                    "#15 choice_slot_control", "#17 choice_slot_replication", "#19 answer_slot_patch"]
    motivated_by: "research/narrative/notes/choice_slot_replication_result.md:67"
    status: proposed
    end_state: true
    author_decision: null
    budget: {ndif_jobs: 528, wall_hours: 6}
    spent: {ndif_jobs: 0, wall_hours: 0}
    procedure: >-
      PROGRAM_v2 §4 NC1: rho = T_proj / T0 on the pilot's registered block-16/24 statistic, p_b fitted
      on the eight property domains; nulls are the pilot's exact 2^8 world-label orientation null and
      64 cosine-matched directions; delta is simulated at 80% power and committed before projection.
      Branches are mutually exclusive; first match wins.
    outcomes:
      - {if: "gate 0 fails: T0 not within 0.0005 of +0.0854, or the repeat-drift gate fails on re-extraction", then: escalate}
      - {if: "delta >= 0.5: underpowered by design, NC1 does not run", then: escalate}
      - {if: "rho_hi < delta and T_proj < q05 of the cosine-matched residuals", then: holds, child: nc2b-goal-relative}
      - {if: "rho_lo > delta and T_proj > the orientation null's q95", then: falsify}
      - {if: "the same falsified result: fund one causal node?", then: escalate}
      - {if: "rho_lo <= 0 and rho_hi >= delta", then: underpowered, child: nc2b-goal-relative}
      - {if: "otherwise", then: narrow, child: nc2b-goal-relative}
    default: "close: no causal node; the claim keeps its terminal status"
    decide_by: 2026-10-29

