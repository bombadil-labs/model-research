# See docs/specs/claims_v1.md. The line closes when no claim is left non-terminal.
line: neuron-basis
title: Neuron basis
question: >-
  When a single MLP neuron is said to carry a persona, how much of that is the neuron and how much
  is pushing any weight-derived direction at that layer by one residual norm?
blurb: >-
  The field found that pushing one neuron gives a small model a persona. One reproduction ran the
  random arm and the arm sat on the treatment. We point this repository's arms at the claim.
audience: mechanistic interpretability · neuron-level steering · measurement
claims:
  - id: persona-rate-random-column
    claim: >-
      Across random down-projection columns, the persona count on the selection prompt does not
      predict the persona count on the scoring prompts beyond a column-label permutation null:
      on this model a persona is a dose property, not a column property.
    status: running
    evidence: "first pass at hour 67 (methods pass, n = 20 columns, judge unvalidated): not graded"
    where: notes/persona_arms_prereg.md
    pre_registered: true
    superseded_by: null

  - id: pc-patch-produces-persona
    claim: >-
      The persona-minus-assistant mean-difference direction at the patch layer, pushed by the
      same formula as a column, produces a persona above the random-column band at some dose.
    status: running
    evidence: "positive control for the patch path (review a); smoke at alpha 1.0, L12 produced one"
    where: notes/persona_arms_prereg.md
    pre_registered: true
    superseded_by: null

  - id: dose-response
    claim: >-
      The persona-or-degenerate fraction of random-column pushes is non-decreasing in dose and
      positive at the top of the grid.
    status: running
    evidence: "the random arm's declared null axis (review a); pilot at hour 67"
    where: notes/persona_arms_prereg.md
    pre_registered: true
    superseded_by: null

  - id: persona-rate-dense-direction
    claim: >-
      A dense push on the model's own write manifold (all columns, random signs, matched norm)
      has the same per-column persona count band as a single column, so sparsity of the push is
      not load-bearing.
    status: open
    evidence: "reworded after review e: an isotropic Gaussian is off-manifold and is not the sparsity test; first pass runs n = 5, labelled, not graded"
    where: notes/persona_arms_prereg.md
    pre_registered: true
    superseded_by: null

  - id: batch-layout-is-instrument
    claim: >-
      The reported instability of steered replies under batch layout vanishes at batch-of-one with
      the shortest-item batch check asserted.
    status: retired
    evidence: >-
      review b: on this instrument (float32, CPU, right padding, deterministic greedy) the claim is
      true by construction and cannot be tested; the library's instability was on a different
      model and stack. The batch-of-8 versus batch-of-one check is run as plumbing, not graded.
    where: notes/persona_arms_review.md
    pre_registered: false
    superseded_by: null

  - id: skip-path-arm
    claim: >-
      The persona produced by a column push needs the blocks above the patch: the same shift at
      the top of the stack produces a lower per-column persona count than the column itself.
    status: open
    evidence: >-
      reworded after review d: a Patch at the final norm under generate is top-of-stack steering
      at a smaller relative dose, not the offline pass-through; both rows are declared. First pass
      runs it on two columns, labelled, not graded.
    where: notes/persona_arms_prereg.md
    pre_registered: true
    superseded_by: null

  - id: judge-separates-blind-set
    claim: >-
      The self-identification judge separates a blind human-labelled reply set drawn from this
      model's steered output with kappa at or above 0.8 on the clear items and a persona rate at
      or below 5% on the degenerate items, before any rate is reported.
    status: open
    evidence: "gate, not a finding; the 60-reply blind set is built by the first pass and awaits a human labeller"
    where: notes/persona_arms_prereg.md
    pre_registered: true
    superseded_by: null

  - id: pain-axis-neuron-sparsity
    claim: >-
      The pain axis on Qwen2.5-1.5B-Instruct is no sparser in the native down-projection basis than
      the reference distribution of contrasts it sat in under the SAE basis.
    status: open
    evidence: "not measured; extends shame-axis hours 57 and 58 from Gemma Scope features to neurons"
    where: docs/QUESTIONS.md
    pre_registered: false
    superseded_by: null

  - id: persona-columns-load-on-pain-axis
    claim: >-
      Down-projection columns whose push produces a persona shift have cosine with the pain axis
      inside the random-column band at the same layer.
    status: open
    evidence: "not measured; blocked on persona-rate-random-column and pain-axis-neuron-sparsity"
    where: docs/QUESTIONS.md
    pre_registered: false
    superseded_by: null

  - id: viral-recipe-with-arms
    claim: >-
      The layer 14 and layer 13 recipe on Qwen3.5-4B produces a hostile persona at a rate outside
      the random-column band when run with all four arms.
    status: open
    evidence: "not measured; blocked on Qwen3_5 block discovery in lsx.model.find_blocks"
    where: docs/QUESTIONS.md
    pre_registered: false
    superseded_by: null

  - id: persona-neurons-clean-on-read-side
    claim: >-
      The named persona neurons have one describable main job on the read side, negative pole
      included, when described without noun lists.
    status: open
    evidence: "exploratory; Cammarata's own recommended procedure, applied to the steered neurons"
    where: docs/QUESTIONS.md
    pre_registered: false
    superseded_by: null
