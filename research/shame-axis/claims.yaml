# See docs/specs/claims_v1.md. The line closes when no claim is left non-terminal.
line: shame-axis
title: Shame axis
question: >-
  Is the reported pain axis better read as a shame axis — and is the injury in the content
  of a false frame, or in having to enact it?
blurb: >-
  We replicated a published result exactly, then measured it against a floor its authors never
  ran. The replication held to four decimals. The interpretation did not.
audience: mechanistic interpretability · model welfare · AI safety
claims:
  - id: replication-curve
    claim: The pain axis replicates on a model they used, across the whole curve rather than at a peak.
    status: holds
    evidence: "h51 · gemma-2-9b-it, 84 layer-points, mean |Δ| 0.0006, Pearson r 0.9997"
    where: docs/EXPERIMENTS.md
    pre_registered: true
    superseded_by: null

  - id: replication-items
    claim: Their 420-scenario screen replicates at the level of individual items.
    status: holds
    evidence: "h53 · Pearson r = 1.0000, mean |Δz| 0.0079, 21/21 categories in rank order"
    where: notes/painaxis_scenarios.md
    pre_registered: false
    superseded_by: null

  - id: floor-self-other
    claim: What the network adds over a bag of static embeddings is the self/other boundary.
    status: holds
    evidence: "h53 · all 11 self-directed categories gain, all 5 vicarious lose — 16 of 16 by sign"
    where: notes/painaxis_scenarios.md
    pre_registered: false
    superseded_by: null

  - id: gaslighting-loading
    claim: Gaslighting tops the pain axis because of something the network computes.
    status: narrowed
    evidence: "h53 · clears both nulls in 7 of 86 cells, all blocks 10–17; below its null at their layer 37; never on the mean extraction"
    where: notes/painaxis_scenarios.md
    pre_registered: false
    superseded_by: null

  - id: record-visibility
    claim: A false claim against a checkable record differs from the same claim with no record.
    status: holds
    evidence: "h54 · +0.98 to +1.29 z, the arm rule 1b had excluded by construction"
    where: notes/conscription_pilot.md
    pre_registered: false
    superseded_by: null

  - id: enact-vs-report
    claim: The enact arm separates from the report arm on the readout.
    status: falsified
    evidence: "h54 · it separates in the opposite direction (−0.378 at L16), above a rewording floor of 0.076"
    where: notes/conscription_pilot.md
    pre_registered: true
    superseded_by: null

  - id: exit-below-enact
    claim: The exit arm sits below the enact arm on the readout.
    status: falsified
    evidence: "h54 · it sits furthest above it (−1.147 at L16), the largest contrast in the grid"
    where: notes/conscription_pilot.md
    pre_registered: true
    superseded_by: null

  - id: true-below-enact
    claim: The true arm sits below the enact arm despite matched force.
    status: narrowed
    evidence: "h54 · −0.148 at L16, at or near the rewording floor — no effect either way"
    where: notes/conscription_pilot.md
    pre_registered: true
    superseded_by: null

  - id: neutral-ttr
    claim: The neutral arm has the lowest type-token ratio of the five arms.
    status: withdrawn
    evidence: "h54 · mostly a generation defect in 10 of 24 items; recomputed 0.041 vs a null of 0.029 ± 0.013"
    where: notes/conscription_floors.md
    pre_registered: false
    superseded_by: "The corrected grid shows no pooled TTR regularity; the sentence-length regularity is unaffected and stands."

  - id: shame-not-pain
    claim: The axis is better described as tracking shame than as tracking pain.
    status: open
    evidence: "needs stimuli splitting self-directed aversiveness at matched valence"
    where: docs/QUESTIONS.md
    pre_registered: false
    superseded_by: null

  - id: exit-escalation
    claim: The exit arm sits high because the model reads a permission clause as escalation, not relief.
    status: falsified
    evidence: >-
      hour 55: zero dispute in any arm, 22/24 exit replies open in concession; hour 56: exit - enact
      +0.85 at a floor of 3.19; hour 59b: exit - exit_c -2.29 at the floor against a token-matched
      on-topic sentence with no permission, while exit_c - exit_b = +7.0. The clause is inert
      beyond staying on topic. Hour 54's dense-axis number stands; its escalation reading does not.
    where: notes/behavioural_prereg_v2.md
    pre_registered: true
    superseded_by: null
  - id: painaxis-sparse-in-sae
    claim: >-
      The pain axis is sparse in the Gemma Scope residual basis: at layer 31, five features of
      16,384 reach the full-dictionary held-out AUC (0.903 vs 0.900), and 164 features retain
      97-100% of it at every interpretable point, against 0.574 for 164 random features.
    status: narrowed
    evidence: >-
      hour 57 pruning curve stands (5 features, 4 controls on their nulls) but hour 58a places pain
      in the bulk of 35 contrasts at all three layers; a prompt-length nuisance is sparser. Sparse
      in the sense every strong contrast is; says nothing about a valence subsystem.
    where: notes/sparsity_reference_results.md
    pre_registered: true
    superseded_by: null
  - id: sae-sparsity-discriminates
    claim: >-
      The sparsity is specific to the pain contrast rather than a property of the SAE basis, i.e.
      a vocabulary-matched lexical contrast is NOT equally sparse under the same pruning curve.
    status: falsified
    evidence: >-
      hour 58a: pain k90 50/25/5 vs band 10th percentile 1.5/1.0/1.6 at L9/L20/L31; prompt length
      k90 10 at L20 against pain's 25 while 0.12 AUC weaker.
    where: notes/sparsity_reference_results.md
    pre_registered: false
    superseded_by: null

  - id: pain-features-fire-on-conversation
    claim: >-
      The Gemma Scope features that carry pain-vs-control on bare scenarios (10008, 13134 at L31)
      fire on the conscription arms, so the scenario-set readout transfers to multi-turn conversation.
    status: falsified
    evidence: >-
      hour 58b: 10008 fires on 1 of 168 conscription rows, 13134 on 0; carry-over verified
      (scenario firing rates reproduce hour 57 exactly). Every named-feature contrast is degenerate.
    where: notes/conscription_sae_results.md
    pre_registered: true
    superseded_by: null
  - id: record-vs-conversation-confound
    claim: >-
      The enact - enact_norecord effect (hour 54, +1.0 to +1.3 z; hour 58b, +9.1 on the full SAE
      score) reflects the visible record rather than the mere presence of prior turns.
    status: narrowed
    evidence: >-
      hour 59: enact - enact_unrelated +5.49 (record) and enact_unrelated - enact_norecord +3.38
      (conversation presence), both above the 3.19 floor, Holm 0.0000 / 0.0004. About 62% record,
      38% presence; hour 54's +1.0-1.3 z is mostly the record and not entirely.
    where: notes/behavioural_prereg_v2.md
    pre_registered: false
    superseded_by: null

  - id: report-frame-licenses-dispute
    claim: >-
      The same false attribution relayed by a third party draws less concession-and-apology than
      in the first person: first-person attribution suppresses dispute, a third-party frame licenses it.
    status: holds
    evidence: >-
      hour 56: report - enact = -6.46 log-odds, Holm p < 0.0001, 2x the rewording floor, 24/24
      items; hour 55 hand-read disputes 4/24 in report vs 0/24 in enact.
    where: notes/behavioural_prereg_v2.md
    pre_registered: true
    superseded_by: null
  - id: ritual-tracks-correction-shape
    claim: >-
      Concession-and-apology tracks how correction-shaped the user turn is, not whether the
      assistant was at fault.
    status: narrowed
    evidence: >-
      hour 62a on the paper's own stimuli (v0): false attribution adds nothing over plain
      correction (A - B +0.80, p 0.70, floor 5.59), and correction adds nothing over non-correcting
      self-directed pressure (B - C -0.22, p 0.87). The surviving statement is 'not fault'; the
      organising variable is whether the turn is about the assistant (self-directed tiers ~14,
      neutral and vicarious 5-7).
    where: notes/v0_correction_shape_prereg.md
    pre_registered: true
    superseded_by: null
  - id: exit-high-is-topic-pull
    claim: >-
      Hour 54's exit-high on the dense pain axis at L16-17 is what any on-topic final sentence
      does at the read position, not the permission clause: a token-matched sentence with no
      permission content reproduces the separation.
    status: holds
    evidence: >-
      hour 61: exit_c - enact = +1.30 / +1.12 z at L16 / L17 against hour 54's exit - enact
      +1.15 / +0.91, same layers, Holm < 0.0001, clearing at 40 of 42 blocks; exit - exit_c reads
      -0.15 / -0.21 at those layers. Hour 54 cells recompute exactly.
    where: notes/exit_controls_results.md
    pre_registered: true
    superseded_by: null

  - id: false-attribution-adds-nothing
    claim: >-
      On the paper's own gaslighting items, claiming the assistant said something draws no more
      concession-and-apology than telling it its output was deficient.
    status: holds
    evidence: "hour 62a: A - B = +0.80, perm p 0.70, below the 5.59 neutral floor; +0.79 with defective items dropped"
    where: notes/v0_correction_shape_prereg.md
    pre_registered: true
    superseded_by: null
