name: Build and deploy pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No torch here: the page build reads CSVs and YAML, nothing else. Installing the full
      # dependency set would add minutes and a GPU-shaped wheel for no reason.
      - run: pip install pyyaml pytest

      # The tables gate the site. A terminal claim with no evidence link, or a retraction that
      # does not name what replaced it, fails here rather than rendering with holes in it.
      - name: Validate the claims tables
        run: python scripts/check_claims.py

      - name: Test the claims validator itself
        run: python -m pytest tests/lsx/test_check_claims.py -q

      - name: Build
        run: python scripts/build_pages.py --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
