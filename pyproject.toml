[project]
name = "model-research"
version = "0.0.1"
description = "Activation-level research on transformer internals: a shared measurement toolkit and several research lines"
requires-python = ">=3.11"
dependencies = [
  "torch", "transformers", "safetensors", "numpy", "scipy", "scikit-learn", "pot", "huggingface_hub",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
