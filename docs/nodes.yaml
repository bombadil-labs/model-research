# Shared nodes (docs/PROGRAM_v2.md §3 and §6), validated by `python scripts/check_nodes.py`.
# They name no claims. Decisions carry a default and a date (R4); infra nodes carry a budget.
# PROPOSAL: `accepted` stays null until the author accepts PROGRAM_v2 in a session, recorded in
# docs/decisions.yaml (rule D).
line: shared
accepted: null

nodes:
  - id: c3-ci-and-hooks
    title: Run core tests, check_claims, check_nodes and the claim-text diff on every PR, and fix or delete the hooks?
    kind: decide
    claims: []
    parent: null
    status: proposed
    outcomes:
      - {if: "apply, or approve an agent to apply (>= 380 tests collected, skips listed, a new skip fails)", then: continue}
      - {if: "leave", then: close}
    default: "leave"
    decide_by: 2026-10-29

  - id: c5-doc-sweep
    title: Authorize a mechanical sweep of dead links and counts in line documents (never statuses or wording)?
    kind: decide
    claims: []
    parent: null
    status: proposed
    outcomes:
      - {if: "authorize", then: continue}
      - {if: "not authorized", then: close}
    default: "not authorized"
    decide_by: 2026-10-29

  - id: c6-credentials
    title: Re-close v1's item 0.3 (keys through the proxy), or record a new waiver in the author's own words?
    kind: decide
    claims: []
    parent: null
    status: proposed
    outcomes:
      - {if: "re-close via proxy injection", then: continue}
      - {if: "a new waiver, in the author's own words", then: close}
      - {if: "recorded open, with a dated risk note", then: close}
    default: "recorded open, with a dated risk note"
    decide_by: 2026-10-29

  - id: c6-core-paths
    title: Move the core's hard-coded narrative paths into configuration and give reproduce.py a __main__
    kind: infra
    claims: []
    parent: null
    status: proposed
    budget: {wall_hours: 2}

  - id: d13-statuses
    title: Measured-but-inconclusive claims - amend `retired`, or add a new terminal status?
    kind: decide
    claims: []
    parent: null
    status: proposed
    outcomes:
      - {if: "amend claims_v1.md:28 to 'abandoned deliberately, reason on record'; no new status", then: close}
      - {if: "add an `underpowered` terminal status to claims_v1 and check_claims", then: close}
    default: "amend claims_v1.md:28 to 'abandoned deliberately, reason on record'; no new status"
    decide_by: 2026-10-29

  - id: accept-program-v2
    title: Accept PROGRAM_v2 (as amended), so that its nodes can be funded and its defaults can run?
    kind: decide
    claims: []
    parent: null
    status: proposed
    # the one decision with no default (R4): a plan an agent wrote cannot accept itself by silence
    outcomes:
      - {if: "accept", then: close}
      - {if: "accept with amendments, stated in the session", then: close}
      - {if: "reject", then: close}

  - id: d15-rule-d
    title: How are the author's decisions told apart from agent text (rule D)?
    kind: decide
    claims: []
    parent: null
    status: done
    author_decision: D-001
    outcomes:
      - {if: "register a signing key; decisions are signed commits", then: close}
      - {if: "decide in chat; Claude records the words verbatim with the session link", then: close}
    default: "decide in chat; Claude records the words verbatim with the session link"
    decide_by: 2026-10-29

  - id: d16-done-definition
    title: Strengthen CLAUDE.md's definition of done to require rows for every README question and writeup claim?
    kind: decide
    claims: []
    parent: null
    status: proposed
    outcomes:
      - {if: "yes, edit CLAUDE.md", then: close}
      - {if: "no; rows are added under R5 anyway", then: close}
    default: "no; rows are added under R5 anyway"
    decide_by: 2026-10-29

  - id: d17-external
    title: Does either line become something external (a preprint, a post)?
    kind: decide
    claims: []
    parent: null
    status: proposed
    outcomes:
      - {if: "yes, after both writeups exist", then: close}
      - {if: "no", then: close}
    default: "no"
    decide_by: 2026-10-29
